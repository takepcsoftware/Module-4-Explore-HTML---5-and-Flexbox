<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css/table.css">
</head>

<body>

    <main>

        <table>

            <caption> Our Friends </caption>

            <thead>

                <tr>
                    <th>#</th>
                    <th>First name</th>
                    <th>Last name</th>
                    <th>Age</th>
                </tr>

            </thead>



            <tbody>
                <tr>
                    <td>1</td>
                    <td>Akkas</td>
                    <td>Ali</td>
                    <td>25</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Abu</td>
                    <td>Bakkar</td>
                    <td>35</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Nur</td>
                    <td>Nabi</td>
                    <td>22</td>
                </tr>

            </tbody>


            <tfoot>

                <tr>
                    <td colspan="3">Total Friends</td>
                    <td>3</td>
                </tr>

            </tfoot>

        </table>


        <div>
            <ul>
                <li>table head : thead</li>
                <li>table body : tbody
                    <ul>
                        <li>tabel row : tr</li>
                        <li>table data : td</li>
                    </ul>
                </li>

                <li>table foot : tfoot</li>

            </ul>
        </div>

    </main>

</body>

</html>
